[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection 2026 — solo competition entry"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pydicom>=2.4",
    "supervision>=0.25",
    "opencv-python-headless>=4.9",
    "kaggle>=1.6",
    "anthropic>=0.60",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "timm>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
